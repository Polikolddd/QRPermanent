<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>QR Scanner PWA</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; color: #1c1e21; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 1.1rem; color: #1877f2; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #606770; }
    input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 1.1rem; text-align: center; font-weight: bold; }
    button { width: 100%; padding: 12px; margin-top: 14px; background: #1877f2; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #e4e6eb; color: #050505; margin-top: 0; margin-bottom: 12px; font-weight: normal; font-size: 0.85rem; padding: 8px; }
    .btn-cam-switch { background: #42b72a; color: #fff; margin-top: 8px; font-size: 0.9rem; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 12px; min-height: 250px; background: #000; }
    
    .overlay {
      width: 100%;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 20px;
      margin-top: 12px;
      text-align: center;
    }
    .success-overlay { background: #f8f9fa; border: 2px dashed #42b72a; }
    .error-overlay { background: #fff5f5; border: 2px dashed #fa3e3e; }
    
    .big-icon { font-size: 56px; margin-bottom: 8px; animation: popIn 0.3s ease-out; }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .status { margin-top: 10px; font-size: 1rem; font-weight: 600; text-align: center; white-space: pre-line; }
    .success { color: #42b72a; }
    .error { color: #fa3e3e; }
    .hidden { display: none !important; }
    .user-info { font-size: 0.95rem; color: #1877f2; margin-bottom: 8px; text-align: center; font-weight: 600; }
    .loading-text { font-size: 0.8rem; color: #8d949e; text-align: center; margin-top: 6px; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- Блок авторизации по ID -->
  <div id="settingsCard" class="card">
    <h2>👤 Авторизация по ID</h2>
    <label for="operatorId">Введите ваш ID:</label>
    <input type="text" id="operatorId" placeholder="Например: 242270">

    <button onclick="saveSettings()">Войти в систему</button>
    <div id="dbStatus" class="loading-text">🔄 Подключение к базе пользователей...</div>
  </div>

  <button id="toggleSettingsBtn" class="btn-secondary hidden" onclick="toggleSettings()">⚙️ Сменить ID / Профиль</button>

  <!-- Блок сканера -->
  <div class="card">
    <h2>📷 Сканер QR-кода</h2>
    <div id="userInfo" class="user-info"></div>
    
    <div id="reader"></div>
    <button id="switchCamBtn" class="btn-cam-switch hidden" onclick="switchCamera()">🔄 Сменить объектив</button>

    <!-- Уведомление об успехе (Yes) -->
    <div id="successOverlay" class="overlay success-overlay hidden">
      <div class="big-icon">✅</div>
      <div id="scanResult" class="status success">Данные успешно отправлены!</div>
    </div>

    <!-- Уведомление об отказе (No) -->
    <div id="errorOverlay" class="overlay error-overlay hidden">
      <div class="big-icon">⛔</div>
      <div id="errorResult" class="status error">Питание запрещено!</div>
    </div>
  </div>

  <script>
    const SHEET_URL_OR_ID = 'https://docs.google.com/spreadsheets/d/1vj8_WZXK8B73QwI1Qmn-J5tmAdGVT7izX555WoBFkwU/edit?usp=sharing'; 
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdyI6Y-04_nYm8e0OCxjAmO7xaNHE9qjocjuuRXQznPEWbAmg/viewform'; 
    const ENTRY_NAME = 'entry.1408210808';    
    const ENTRY_COMPANY = 'entry.1935797578'; 

    let operatorsDatabase = {};
    let isDbLoaded = false;
    let html5QrCode = null;
    let isProcessing = false; 
    let countdownTimer = null;

    let availableCameras = [];
    let currentCameraIndex = 0;

    function extractSheetId(input) {
      if (!input) return '';
      const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : input.trim();
    }

    const SHEET_ID = extractSheetId(SHEET_URL_OR_ID);

    document.addEventListener("DOMContentLoaded", () => {
      loadDatabaseFromGoogleSheet();
    });

    function cleanString(str) {
      return String(str || '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
    }

    function getCleanDigits(str) {
      return cleanString(str).replace(/\D/g, '');
    }

    async function loadDatabaseFromGoogleSheet() {
      const statusDiv = document.getElementById("dbStatus");
      const timestamp = new Date().getTime();
      const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&t=${timestamp}`;

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Ошибка сети");
        const csvText = await response.text();
        
        Papa.parse(csvText, {
          skipEmptyLines: true,
          complete: function(results) {
            parseParsedRows(results.data);
            isDbLoaded = true;
            statusDiv.innerText = "🟢 База пользователей готова";
            statusDiv.style.color = "#42b72a";
            checkAutoLogin();
          }
        });
      } catch (err) {
        console.error("Ошибка загрузки базы:", err);
        statusDiv.innerText = "⚠️ Ошибка подключения к базе.";
        statusDiv.style.color = "#fa3e3e";
      }
    }

    function parseParsedRows(rows) {
      operatorsDatabase = {};

      rows.forEach((cols, index) => {
        if (index === 0 || cols.length < 2) return;

        const rawId = cleanString(cols[0]);
        const digitId = getCleanDigits(rawId);
        const fio = cleanString(cols[1]);
        const company = cleanString(cols[2]);
        const permission = cleanString(cols[4] || "No");

        if (rawId && fio) {
          const userObj = { fio: fio, company: company, permission: permission };
          operatorsDatabase[rawId] = userObj;
          if (digitId) {
            operatorsDatabase[digitId] = userObj;
          }
        }
      });
    }

    function findUser(idInput) {
      const cleanedInput = cleanString(idInput);
      const digitsOnly = getCleanDigits(idInput);
      return operatorsDatabase[cleanedInput] || operatorsDatabase[digitsOnly] || null;
    }

    function checkAutoLogin() {
      const savedId = localStorage.getItem("app_operator_id") || "";
      if (savedId) {
        const user = findUser(savedId);
        if (user) {
          document.getElementById("operatorId").value = savedId;
          hideSettings();
          updateUserInfoDisplay(user.fio, user.company);
          startCamera();
        } else {
          showSettings();
        }
      } else {
        showSettings();
      }
    }

    function saveSettings() {
      if (!isDbLoaded) {
        alert("База пользователей ещё загружается, подождите 2 секунды...");
        return;
      }

      const inputId = document.getElementById("operatorId").value;
      if (!inputId.trim()) {
        alert("Пожалуйста, введите ваш ID!");
        return;
      }

      const user = findUser(inputId);

      if (!user) {
        alert(`❌ Ошибка: Пользователь с ID "${inputId.trim()}" не найден в Google Таблице!`);
        return;
      }

      localStorage.setItem("app_operator_id", inputId.trim());
      localStorage.setItem("app_fio", user.fio);
      localStorage.setItem("app_company", user.company);
      
      updateUserInfoDisplay(user.fio, user.company);
      hideSettings();
      
      if (!html5QrCode) {
        startCamera();
      }
    }

    function hideSettings() {
      document.getElementById("settingsCard").classList.add("hidden");
      document.getElementById("toggleSettingsBtn").classList.remove("hidden");
    }

    function showSettings() {
      document.getElementById("settingsCard").classList.remove("hidden");
      document.getElementById("toggleSettingsBtn").classList.add("hidden");
    }

    function toggleSettings() {
      const settingsCard = document.getElementById("settingsCard");
      if (settingsCard.classList.contains("hidden")) {
        showSettings();
      } else {
        hideSettings();
      }
    }

    function updateUserInfoDisplay(fio, company) {
      document.getElementById("userInfo").innerText = `Профиль: ${fio} ${company ? '(' + company + ')' : ''}`;
    }

    async function startCamera() {
      document.getElementById("successOverlay").classList.add("hidden");
      document.getElementById("errorOverlay").classList.add("hidden");
      document.getElementById("reader").classList.remove("hidden");

      isProcessing = false;
      if (html5QrCode) return; 

      html5QrCode = new Html5Qrcode("reader");

      try {
        const allCameras = await Html5Qrcode.getCameras();
        
        availableCameras = allCameras.filter(c => {
          const label = c.label.toLowerCase();
          const isFront = label.includes("front") || label.includes("user") || label.includes("передн") || label.includes("selfie");
          return !isFront;
        });

        if (availableCameras.length === 0) availableCameras = allCameras;

        let primaryCamera = availableCameras.find(c => {
          const label = c.label.toLowerCase();
          return !label.includes("0.6") && !label.includes("wide") && !label.includes("ultra") && !label.includes("широк");
        });

        if (!primaryCamera && availableCameras.length > 0) primaryCamera = availableCameras[0];

        let cameraConstraint = primaryCamera && primaryCamera.id ? primaryCamera.id : { facingMode: "environment" };

        if (availableCameras.length > 1) {
          document.getElementById("switchCamBtn").classList.remove("hidden");
        }

        await html5QrCode.start(
          cameraConstraint,
          { fps: 15, qrbox: { width: 260, height: 260 } },
          onScanSuccess,
          onScanError
        );
      } catch (err) {
        console.error("Ошибка запуска камеры:", err);
        try {
          await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 260, height: 260 } }, onScanSuccess, onScanError);
        } catch(e) { html5QrCode = null; }
      }
    }

    async function switchCamera() {
      if (!availableCameras || availableCameras.length < 2) return;

      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      const nextCamera = availableCameras[currentCameraIndex];

      if (html5QrCode) {
        try { await html5QrCode.stop(); } catch(e) {}
        html5QrCode = null;
      }

      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(nextCamera.id, { fps: 15, qrbox: { width: 260, height: 260 } }, onScanSuccess, onScanError);
    }

    // Проверка разрешения (столбец E) при сканировании
    function onScanSuccess(qrData) {
      if (isProcessing) return;
      isProcessing = true;

      const savedId = localStorage.getItem("app_operator_id") || "";
      const user = findUser(savedId);

      const permissionStatus = user && user.permission ? user.permission.toLowerCase() : "";

      // Если в столбце E не YES — БЛОКИРУЕМ!
      if (permissionStatus !== "yes") {
        stopCameraAndShowError(`⛔ Ошибка доступа!\nУ сотрудника ${user ? user.fio : ''}\nв столбце E стоит "${user ? user.permission : 'No'}".\nДанные НЕ отправлены!`);
        return;
      }

      sendToGoogleForm(qrData);
    }

    function onScanError(error) {}

    function sendToGoogleForm(qrData) {
      const fio = localStorage.getItem("app_fio") || "";
      const company = localStorage.getItem("app_company") || "";

      let postUrl = FORM_URL.replace(/\/viewform.*/, '/formResponse');
      if (!postUrl.endsWith('/formResponse')) {
        postUrl = postUrl.replace(/\/$/, '') + '/formResponse';
      }

      const formData = new FormData();
      formData.append(ENTRY_NAME, fio);
      formData.append(ENTRY_COMPANY, company);

      fetch(postUrl, {
        method: "POST",
        mode: "no-cors",
        body: formData
      })
      .then(() => {
        stopCameraAndShowSuccess();
      })
      .catch((err) => {
        stopCameraAndShowError("❌ Ошибка при отправке. Проверьте интернет.");
      });
    }

    function stopCameraAndShowError(errorText) {
      document.getElementById("switchCamBtn").classList.add("hidden");
      const errorDiv = document.getElementById("errorResult");
      errorDiv.innerText = errorText;

      const hideAndShowOverlay = () => {
        document.getElementById("reader").classList.add("hidden");
        document.getElementById("errorOverlay").classList.remove("hidden");
        
        setTimeout(() => {
          document.getElementById("errorOverlay").classList.add("hidden");
          startCamera();
        }, 4000);
      };

      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          hideAndShowOverlay();
        }).catch(() => {
          html5QrCode = null;
          hideAndShowOverlay();
        });
      } else {
        hideAndShowOverlay();
      }
    }

    function stopCameraAndShowSuccess() {
      document.getElementById("switchCamBtn").classList.add("hidden");
      const hideAndShowOverlay = () => {
        document.getElementById("reader").classList.add("hidden");
        document.getElementById("successOverlay").classList.remove("hidden");
        startCountdown(300);
      };

      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          hideAndShowOverlay();
        }).catch(() => {
          html5QrCode = null;
          hideAndShowOverlay();
        });
      } else {
        hideAndShowOverlay();
      }
    }

    function startCountdown(seconds) {
      const scanResultDiv = document.getElementById("scanResult");
      let timeLeft = seconds;
      
      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeString = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        scanResultDiv.innerHTML = `✅ Отсканировано и отправлено!<br><span style="font-size: 1.1rem; color: #1877f2; font-weight: bold;">⏱ Таймер: ${timeString}</span>`;
        
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdownTimer);
          startCamera();
        }
      }, 1000);
    }
  </script>
</body>
</html>
