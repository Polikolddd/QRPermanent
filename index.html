<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>QR Meal Check-in</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; color: #1c1e21; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 1.1rem; color: #1877f2; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #606770; }
    
    input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 1.1rem; text-align: center; font-weight: bold; transition: all 0.2s; }
    button { width: 100%; padding: 12px; margin-top: 14px; background: #1877f2; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    
    /* Стили для заблокированных элементов */
    input:disabled { background-color: #f2f3f5; color: #8d949e; border-color: #dcdee1; cursor: not-allowed; }
    button:disabled { background-color: #9cbdf8; cursor: not-allowed; opacity: 0.7; }

    .btn-secondary { background: #e4e6eb; color: #050505; margin-top: 0; margin-bottom: 12px; font-weight: normal; font-size: 0.85rem; padding: 8px; }
    
    .overlay {
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 20px;
      margin-top: 12px;
      text-align: center;
    }
    .success-overlay { background: #f8f9fa; border: 2px dashed #42b72a; }
    .error-overlay { background: #fff5f5; border: 2px dashed #fa3e3e; }
    .idle-overlay { background: #f0f2f5; border: 2px dashed #ccd0d5; }
    .swipe-overlay { background: #f7f9fc; border: 2px dashed #1877f2; }
    
    .big-icon { font-size: 56px; margin-bottom: 8px; animation: popIn 0.3s ease-out; }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .status { margin-top: 10px; font-size: 1rem; font-weight: 600; text-align: center; white-space: pre-line; }
    .success { color: #42b72a; }
    .error { color: #fa3e3e; }
    .idle { color: #606770; }
    .hidden { display: none !important; }
    .user-info { font-size: 0.95rem; color: #1877f2; margin-bottom: 8px; text-align: center; font-weight: 600; line-height: 1.4; }
    .loading-text { font-size: 0.85rem; color: #8d949e; text-align: center; margin-top: 8px; font-weight: 600; }

    /* --- СТИЛИ ДЛЯ СВАЙПЕРА --- */
    .swipe-container {
      width: 100%;
      max-width: 300px;
      margin: 18px auto 0 auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    .swipe-track {
      position: relative;
      height: 54px;
      background: #e4e6eb;
      border-radius: 27px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }
    .swipe-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1877f2, #42b72a);
      border-radius: 27px;
    }
    .swipe-text {
      position: relative;
      z-index: 1;
      font-weight: 700;
      font-size: 0.9rem;
      pointer-events: none;
      background: linear-gradient(90deg, #606770 0%, #1c1e21 50%, #606770 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2s infinite linear;
    }
    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .swipe-thumb {
      position: absolute;
      left: 3px;
      top: 3px;
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 2;
      color: #1877f2;
    }
    .swipe-thumb:active {
      cursor: grabbing;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- Блок авторизации -->
  <div id="settingsCard" class="card">
    <h2>👤 Авторизация по ID / ИИН</h2>
    <label for="operatorId">Введите ваш ID или ИИН:</label>

    <input type="text" id="operatorId" placeholder="Загрузка базы..." disabled>
    <button id="submitBtn" onclick="saveSettings()" disabled>Войти в систему</button>

    <div id="dbStatus" class="loading-text">🔄 Подключение к базе пользователей...</div>
  </div>

  <button id="toggleSettingsBtn" class="btn-secondary hidden" onclick="toggleSettings()">⚙️ Сменить ID / Профиль</button>

  <!-- Блок статуса отметки -->
  <div class="card">
    <h2>🍽 Статус отметки</h2>
    <div id="userInfo" class="user-info"></div>

    <!-- Уведомление о необходимости СВАЙПА -->
    <div id="swipeOverlay" class="overlay swipe-overlay hidden">
      <div class="big-icon">📲</div>
      <div style="font-weight: 700; color: #1877f2; font-size: 1rem;">QR-код отсканирован</div>
      <div style="font-size: 0.85rem; color: #606770; margin-top: 4px;">Свайпните вправо для подтверждения питания</div>
      
      <div class="swipe-container">
        <div class="swipe-track" id="swipeTrack">
          <div class="swipe-fill" id="swipeFill"></div>
          <span class="swipe-text">Подтвердить отметку ➔</span>
          <div class="swipe-thumb" id="swipeThumb">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Уведомление об успехе -->
    <div id="successOverlay" class="overlay success-overlay hidden">
      <div class="big-icon">✅</div>
      <div id="scanResult" class="status success">Питание отмечено!</div>
    </div>

    <!-- Уведомление об отказе -->
    <div id="errorOverlay" class="overlay error-overlay hidden">
      <div class="big-icon">⛔</div>
      <div id="errorResult" class="status error">Питание запрещено!</div>
    </div>

    <!-- Режим ожидания -->
    <div id="idleOverlay" class="overlay idle-overlay hidden">
      <div class="big-icon">ℹ️️</div>
      <div class="status idle">Вы авторизованы.<br>Для отметки отсканируйте QR-код на стойке.</div>
    </div>
  </div>

  <script>
    // 1. УНИВЕРСАЛЬНОЕ ХРАНИЛИЩЕ ДЛЯ IOS SAFARI (localStorage + Cookie Fallback)
    function setSavedData(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) { console.warn("localStorage недоступен"); }
      
      const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
      document.cookie = `${key}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
    }

    function getSavedData(key) {
      let val = null;
      try {
        val = localStorage.getItem(key);
      } catch (e) {}

      if (val) return val;

      const matches = document.cookie.match(new RegExp(
        "(?:^|; )" + key.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
      ));
      return matches ? decodeURIComponent(matches[1]) : "";
    }

    // 2. ССЫЛКИ И НАСТРОЙКИ
    const PUBLISHED_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOI08oO0YNF0Zu6Kd_EM53ZFcriAK3glDBMUoz7oFvczuYInArDm2IRBdvt5lVzvTS0HVYajVa1Yph/pub?gid=41161104&single=true&output=csv';
    const FORM_URL          = 'https://docs.google.com/forms/d/e/1FAIpQLSdyI6Y-04_nYm8e0OCxjAmO7xaNHE9qjocjuuRXQznPEWbAmg/viewform'; 

    const ENTRY_NAME      = 'entry.1408210808'; 
    const ENTRY_COMPANY   = 'entry.1935797578'; 
    const ENTRY_IIN       = 'entry.725430315';  
    const ENTRY_COST_CODE = 'entry.1791590417'; 

    let operatorsDatabase = {};
    let loadedCount = 0;
    let isDbLoaded = false;
    let currentUser = null;
    let countdownTimer = null;
    let currentX = 0; // Переменная смещения свайпера

    document.addEventListener("DOMContentLoaded", () => {
      initDatabase();
      initSwiperLogic();
    });

    function cleanString(str) {
      if (!str) return '';
      return String(str).replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\s+/g, ' ').trim();
    }

    function getCleanDigits(str) {
      return cleanString(str).replace(/\D/g, '');
    }

    function unlockUI() {
      const input = document.getElementById("operatorId");
      const btn = document.getElementById("submitBtn");

      input.disabled = false;
      btn.disabled = false;
      input.placeholder = "Например: 242242 или ИИН";
    }

    // 3. ИНИЦИАЛИЗАЦИЯ БАЗЫ (КЭШ + ФОНОВОЕ ОБНОВЛЕНИЕ)
    function initDatabase() {
      const cachedCsv = getSavedData("cached_db_csv");

      if (cachedCsv) {
        parseCsvAndInit(cachedCsv, true);
        fetchLatestDatabaseInBackground();
      } else {
        loadDatabaseFromGoogleSheet();
      }
    }

    function parseCsvAndInit(csvText, isFromCache = false) {
      const statusDiv = document.getElementById("dbStatus");
      
      Papa.parse(csvText, {
        skipEmptyLines: true,
        complete: function(results) {
          parseParsedRows(results.data);
          isDbLoaded = true;
          
          statusDiv.innerText = `🟢 База готова (${loadedCount} чел.)${isFromCache ? ' ⚡' : ''}`;
          statusDiv.style.color = "#42b72a";
          
          unlockUI();
          processAutoCheckin();
        }
      });
    }

    async function loadDatabaseFromGoogleSheet() {
      const statusDiv = document.getElementById("dbStatus");
      const timestamp = new Date().getTime();
      const csvUrl = `${PUBLISHED_CSV_URL}&t=${timestamp}`;

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Ошибка ответа от Google");
        
        const csvText = await response.text();
        if (csvText.includes("<html") || csvText.includes("<!DOCTYPE html>")) {
             throw new Error("Получен HTML вместо CSV");
        }

        setSavedData("cached_db_csv", csvText);
        parseCsvAndInit(csvText, false);

      } catch (err) {
        console.error("Ошибка загрузки:", err);
        statusDiv.innerText = "⚠️ Ошибка подключения к базе. Проверьте интернет.";
        statusDiv.style.color = "#fa3e3e";
      }
    }

    async function fetchLatestDatabaseInBackground() {
      const timestamp = new Date().getTime();
      const csvUrl = `${PUBLISHED_CSV_URL}&t=${timestamp}`;

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) return;

        const csvText = await response.text();
        if (csvText.includes("<html") || csvText.includes("<!DOCTYPE html>")) return;

        setSavedData("cached_db_csv", csvText);
        Papa.parse(csvText, {
          skipEmptyLines: true,
          complete: function(results) {
            parseParsedRows(results.data);
            console.log("🟢 База успешно обновлена на фоне");
          }
        });
      } catch (err) {
        console.warn("Фоновое обновление базы не удалось:", err);
      }
    }

    function parseParsedRows(rows) {
      operatorsDatabase = {};
      loadedCount = 0;

      rows.forEach((cols, index) => {
        if (index === 0 || cols.length < 2) return;

        const rawId      = cleanString(cols[0]);               // A: ID
        const digitId    = getCleanDigits(rawId);
        const fio        = cleanString(cols[1]);               // B: ФИО
        const company    = cleanString(cols[2]);               // C: Организация
        const iin        = cleanString(cols[3]);               // D: ИИН
        const permission = cleanString(cols[4] || "No");       // E: Статус Yes/No
        const costCode   = cleanString(cols[5] || "");         // F: Кост-код

        if (fio && (rawId || iin)) {
          const userObj = { fio, company, permission, iin, costCode };

          if (rawId) operatorsDatabase[rawId] = userObj;
          if (digitId) operatorsDatabase[digitId] = userObj;
          if (iin) {
            operatorsDatabase[iin] = userObj;
            const digitIin = getCleanDigits(iin);
            if (digitIin) operatorsDatabase[digitIin] = userObj;
          }

          loadedCount++;
        }
      });
    }

    function findUser(idInput) {
      const cleanedInput = cleanString(idInput);
      const digitsOnly = getCleanDigits(idInput);
      return operatorsDatabase[cleanedInput] || operatorsDatabase[digitsOnly] || null;
    }

    function processAutoCheckin() {
      const savedId = getSavedData("app_operator_id");
      const urlParams = new URLSearchParams(window.location.search);
      const isAutoMode = urlParams.get('auto') === '1';

      if (!savedId) {
        showSettings();
        return;
      }

      currentUser = findUser(savedId);
      if (!currentUser) {
        showSettings();
        alert(`❌ Ваш ID/ИИН (${savedId}) не найден в базе. Введите данные повторно.`);
        fetchLatestDatabaseInBackground();
        return;
      }

      hideSettings();
      updateUserInfoDisplay(currentUser);

      // --- ПРОВЕРКА СОХРАНЕННОЙ БЛОКИРОВКИ (ПРИ ПЕРЕЗАГРУЗКЕ СТРАНИЦЫ) ---
      const savedLockExpires = parseInt(getSavedData("app_lock_expires_time") || "0", 10);
      const now = Date.now();

      if (savedLockExpires > now) {
        const remainingSeconds = Math.ceil((savedLockExpires - now) / 1000);
        const savedFio = getSavedData("app_lock_fio") || currentUser.fio;
        showSuccess(`✅ Питание успешно отмечено!\nСотрудник: ${savedFio}`, remainingSeconds);
        return;
      }

      // --- ПРОВЕРКА СКАНА QR-КОДА ---
      if (isAutoMode) {
        window.history.replaceState({}, document.title, window.location.href.split('?')[0]);
        // При сканировании QR-кода ПОКАЗЫВАЕМ СВАЙПЕР (отправка строго после свайпа)
        showSwipeOverlay();
      } else {
        showIdle();
      }
    }

    function executeCheckin(user) {
      const permissionStatus = user.permission ? user.permission.toLowerCase() : "";

      if (permissionStatus !== "yes") {
        showError(`⛔ Ошибка доступа!\nСотрудник: ${user.fio}\nСтатус доступа: "${user.permission}".\nОтметка НЕ отправлена!`);
        fetchLatestDatabaseInBackground();
      } else {
        sendToGoogleFormAuto(user);
      }
    }

    function saveSettings() {
      if (!isDbLoaded) return;

      const inputId = document.getElementById("operatorId").value;
      if (!inputId.trim()) {
        alert("Пожалуйста, введите ваш ID или ИИН!");
        return;
      }

      const user = findUser(inputId);
      if (!user) {
        alert(`❌ Ошибка: Пользователь с ID/ИИН "${inputId.trim()}" не найден в Google Таблице!`);
        fetchLatestDatabaseInBackground();
        return;
      }

      setSavedData("app_operator_id", inputId.trim());
      currentUser = user;
      hideSettings();
      updateUserInfoDisplay(user);

      // Если авторизация прошла во время скана QR, запрашиваем свайп
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('auto') === '1') {
        window.history.replaceState({}, document.title, window.location.href.split('?')[0]);
        showSwipeOverlay();
      } else {
        showIdle();
      }
    }

    function hideSettings() {
      document.getElementById("settingsCard").classList.add("hidden");
      document.getElementById("toggleSettingsBtn").classList.remove("hidden");
    }

    function showSettings() {
      document.getElementById("settingsCard").classList.remove("hidden");
      document.getElementById("toggleSettingsBtn").classList.add("hidden");
      hideAllOverlays();
    }

    function toggleSettings() {
      const settingsCard = document.getElementById("settingsCard");
      if (settingsCard.classList.contains("hidden")) showSettings();
      else hideSettings();
    }

    function updateUserInfoDisplay(user) {
      document.getElementById("userInfo").innerHTML = 
        `👤 <strong>${user.fio}</strong><br>` +
        `<span style="font-size:0.8rem; color:#606770;">${user.company} | ИИН: ${user.iin || '—'} | Кост: ${user.costCode || '—'}</span>`;
    }

    function sendToGoogleFormAuto(user) {
      let postUrl = FORM_URL.replace(/\/viewform.*/, '/formResponse');
      if (!postUrl.endsWith('/formResponse')) {
        postUrl = postUrl.replace(/\/$/, '') + '/formResponse';
      }

      const params = new URLSearchParams();
      params.append(ENTRY_NAME, user.fio);
      params.append(ENTRY_COMPANY, user.company);
      params.append(ENTRY_IIN, user.iin);
      params.append(ENTRY_COST_CODE, user.costCode);

      fetch(postUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params.toString()
      })
      .then(() => {
        // СОХРАНЯЕМ ВРЕМЯ БЛОКИРОВКИ НА 5 МИНУТ (300 СЕКУНД)
        const lockExpires = Date.now() + 300 * 1000;
        setSavedData("app_lock_expires_time", lockExpires.toString());
        setSavedData("app_lock_fio", user.fio);

        showSuccess(`✅ Питание успешно отмечено!\nСотрудник: ${user.fio}`, 300);
        fetchLatestDatabaseInBackground();
      })
      .catch((err) => {
        showError("❌ Ошибка при отправке. Проверьте интернет.");
        fetchLatestDatabaseInBackground();
      });
    }

    function hideAllOverlays() {
      if (countdownTimer) clearInterval(countdownTimer);
      document.getElementById("successOverlay").classList.add("hidden");
      document.getElementById("errorOverlay").classList.add("hidden");
      document.getElementById("idleOverlay").classList.add("hidden");
      document.getElementById("swipeOverlay").classList.add("hidden");
    }

    function showSwipeOverlay() {
      hideAllOverlays();
      resetSwiper();
      document.getElementById("swipeOverlay").classList.remove("hidden");
    }

    function showError(errorText) {
      hideAllOverlays();
      const errorDiv = document.getElementById("errorResult");
      errorDiv.innerText = errorText;
      document.getElementById("errorOverlay").classList.remove("hidden");
    }

    function showSuccess(successText, seconds = 300) {
      hideAllOverlays();
      document.getElementById("successOverlay").classList.remove("hidden");
      startCountdown(seconds, successText);
    }

    function startCountdown(seconds, baseText) {
      const scanResultDiv = document.getElementById("scanResult");
      let timeLeft = seconds;
      
      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeString = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        scanResultDiv.innerHTML = `${baseText}<br><br><span style="font-size: 1.1rem; color: #1877f2; font-weight: bold;">⏱ Экран закроется через: ${timeString}</span>`;
        
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdownTimer);
          setSavedData("app_lock_expires_time", "0");
          showIdle();
        }
      }, 1000);
    }

    function showIdle() {
      hideAllOverlays();
      document.getElementById("idleOverlay").classList.remove("hidden");
    }

    // --- ЛОГИКА СВАЙПЕРА ---
    function initSwiperLogic() {
      const thumb = document.getElementById("swipeThumb");
      const track = document.getElementById("swipeTrack");
      const fill = document.getElementById("swipeFill");

      if (!thumb || !track) return;

      let isDragging = false;
      let startX = 0;
      let maxDrag = 0;

      function getClientX(e) {
        if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
        if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
        return e.clientX;
      }

      function onStart(e) {
        isDragging = true;
        startX = getClientX(e);
        currentX = 0; // Сбрасываем расстояние при каждом новом касании
        const trackRect = track.getBoundingClientRect();
        const thumbRect = thumb.getBoundingClientRect();
        maxDrag = trackRect.width - thumbRect.width - 6;
        if (maxDrag <= 0) maxDrag = 200;

        thumb.style.transition = "none";
        fill.style.transition = "none";
      }

      function onMove(e) {
        if (!isDragging) return;
        const x = getClientX(e);
        let delta = x - startX;
        if (delta < 0) delta = 0;
        if (delta > maxDrag) delta = maxDrag;

        currentX = delta;
        thumb.style.transform = `translateX(${delta}px)`;
        fill.style.width = `${(delta / maxDrag) * 100}%`;
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;

        // Отправляем данные только если протянули более 75% длины
        if (maxDrag > 0 && currentX >= maxDrag * 0.75) {
          thumb.style.transform = `translateX(${maxDrag}px)`;
          fill.style.width = "100%";
          currentX = 0;
          setTimeout(() => {
            resetSwiper();
            hideAllOverlays();
            if (currentUser) {
              executeCheckin(currentUser);
            }
          }, 180);
        } else {
          // Возвращаем ползунок в начало, если свайп не доведи до конца
          thumb.style.transition = "transform 0.25s ease-out";
          fill.style.transition = "width 0.25s ease-out";
          thumb.style.transform = "translateX(0px)";
          fill.style.width = "0%";
          currentX = 0;
        }
      }

      thumb.addEventListener("mousedown", onStart);
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onEnd);

      thumb.addEventListener("touchstart", onStart, { passive: true });
      window.addEventListener("touchmove", onMove, { passive: true });
      window.addEventListener("touchend", onEnd);
      window.addEventListener("touchcancel", onEnd);
    }

    function resetSwiper() {
      currentX = 0;
      const thumb = document.getElementById("swipeThumb");
      const fill = document.getElementById("swipeFill");
      if (thumb && fill) {
        thumb.style.transition = "none";
        fill.style.transition = "none";
        thumb.style.transform = "translateX(0px)";
        fill.style.width = "0%";
      }
    }
  </script>
</body>
</html>
