<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner PWA</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; color: #1c1e21; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h2 { margin-top: 0; font-size: 1.1rem; color: #1877f2; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #606770; }
    input { width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; margin-top: 14px; background: #1877f2; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-secondary { background: #e4e6eb; color: #050505; margin-top: 0; margin-bottom: 12px; font-weight: normal; font-size: 0.85rem; padding: 8px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 12px; min-height: 250px; background: #000; }
    
    /* Стили для экрана с галочкой вместо камеры */
    .success-overlay {
      width: 100%;
      min-height: 250px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 20px;
      margin-top: 12px;
      border: 2px dashed #42b72a;
    }
    .big-check {
      font-size: 56px;
      margin-bottom: 8px;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .status { margin-top: 10px; font-size: 1rem; font-weight: 600; text-align: center; white-space: pre-line; color: #1c1e21; }
    .success { color: #42b72a; }
    .error { color: #fa3e3e; }
    .hidden { display: none !important; }
    .user-info { font-size: 0.9rem; color: #606770; margin-bottom: 8px; text-align: center; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <!-- Блок настроек -->
  <div id="settingsCard" class="card">
    <h2>⚙️ Настройки</h2>
    <label for="fio">Ваше ФИО:</label>
    <input type="text" id="fio" placeholder="Введите ФИО">

    <label for="company">Ваша Компания:</label>
    <input type="text" id="company" placeholder="Введите название компании">

    <button onclick="saveSettings()">Сохранить настройки</button>
  </div>

  <!-- Кнопка изменения настроек -->
  <button id="toggleSettingsBtn" class="btn-secondary hidden" onclick="toggleSettings()">⚙️ Изменить настройки (ФИО / Компания)</button>

  <!-- Блок сканера -->
  <div class="card">
    <h2>📷 Сканер QR-кода</h2>
    <div id="userInfo" class="user-info"></div>
    
    <!-- Окнок камеры -->
    <div id="reader"></div>

    <!-- Экран с галочкой и таймером -->
    <div id="successOverlay" class="success-overlay hidden">
      <div class="big-check">✅</div>
      <div id="scanResult" class="status success">Данные успешно отправлены!</div>
    </div>
  </div>

  <script>
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdyI6Y-04_nYm8e0OCxjAmO7xaNHE9qjocjuuRXQznPEWbAmg/viewform'; 
    const ENTRY_NAME = 'entry.1408210808';    // ФИО
    const ENTRY_COMPANY = 'entry.1935797578'; // Компания

    let html5QrCode = null;
    let isProcessing = false; 
    let countdownTimer = null;

    document.addEventListener("DOMContentLoaded", () => {
      const savedFio = localStorage.getItem("app_fio") || "";
      const savedCompany = localStorage.getItem("app_company") || "";

      document.getElementById("fio").value = savedFio;
      document.getElementById("company").value = savedCompany;

      if (savedFio && savedCompany) {
        hideSettings();
        updateUserInfoDisplay(savedFio, savedCompany);
        startCamera();
      } else {
        showSettings();
      }
    });

    function saveSettings() {
      const fio = document.getElementById("fio").value.trim();
      const company = document.getElementById("company").value.trim();

      if (!fio || !company) {
        alert("Пожалуйста, заполните и ФИО, и Компанию!");
        return;
      }

      localStorage.setItem("app_fio", fio);
      localStorage.setItem("app_company", company);
      
      updateUserInfoDisplay(fio, company);
      hideSettings();
      
      if (!html5QrCode) {
        startCamera();
      }
    }

    function hideSettings() {
      document.getElementById("settingsCard").classList.add("hidden");
      document.getElementById("toggleSettingsBtn").classList.remove("hidden");
    }

    function showSettings() {
      document.getElementById("settingsCard").classList.remove("hidden");
      document.getElementById("toggleSettingsBtn").classList.add("hidden");
    }

    function toggleSettings() {
      const settingsCard = document.getElementById("settingsCard");
      if (settingsCard.classList.contains("hidden")) {
        showSettings();
      } else {
        hideSettings();
      }
    }

    function updateUserInfoDisplay(fio, company) {
      document.getElementById("userInfo").innerText = `Профиль: ${fio} (${company})`;
    }

    function startCamera() {
      // Скрываем галочку, показываем окно камеры
      document.getElementById("successOverlay").classList.add("hidden");
      document.getElementById("reader").classList.remove("hidden");

      isProcessing = false; // Разрешаем сканирование снова

      if (html5QrCode) return; 

      html5QrCode = new Html5Qrcode("reader");
      
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanError
      ).catch(err => {
        console.error("Ошибка запуска камеры:", err);
        html5QrCode = null;
      });
    }

    function onScanSuccess(qrData) {
      if (isProcessing) return;
      isProcessing = true;
      sendToGoogleForm(qrData);
    }

    function onScanError(error) {
      // Игнорируем фоновые ошибки сканирования
    }

    function sendToGoogleForm(qrData) {
      const fio = localStorage.getItem("app_fio") || "";
      const savedCompany = localStorage.getItem("app_company") || "";
      const scanResultDiv = document.getElementById("scanResult");

      const companyValue = savedCompany ? savedCompany : qrData;

      let postUrl = FORM_URL.replace(/\/viewform.*/, '/formResponse');
      if (!postUrl.endsWith('/formResponse')) {
        postUrl = postUrl.replace(/\/$/, '') + '/formResponse';
      }

      const formData = new FormData();
      formData.append(ENTRY_NAME, fio);
      formData.append(ENTRY_COMPANY, companyValue);

      scanResultDiv.className = "status success";
      scanResultDiv.innerText = "⏳ Отправка данных...";

      fetch(postUrl, {
        method: "POST",
        mode: "no-cors",
        body: formData
      })
      .then(() => {
        // Успешно отправили: выключаем камеру и показываем галочку с таймером
        stopCameraAndShowSuccess();
      })
      .catch((err) => {
        scanResultDiv.className = "status error";
        scanResultDiv.innerText = "❌ Ошибка при отправке. Проверьте интернет.";
        isProcessing = false;
      });
    }

    function stopCameraAndShowSuccess() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          document.getElementById("reader").classList.add("hidden");
          document.getElementById("successOverlay").classList.remove("hidden");
          startCountdown(300); // Запуск таймера на 5 минут
        }).catch(err => {
          console.error("Ошибка остановки:", err);
          html5QrCode = null;
          document.getElementById("reader").classList.add("hidden");
          document.getElementById("successOverlay").classList.remove("hidden");
          startCountdown(300);
        });
      } else {
        document.getElementById("reader").classList.add("hidden");
        document.getElementById("successOverlay").classList.remove("hidden");
        startCountdown(300);
      }
    }

    function startCountdown(seconds) {
      const scanResultDiv = document.getElementById("scanResult");
      let timeLeft = seconds;
      
      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeString = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        scanResultDiv.innerHTML = `✅ Отсканировано и отправлено!<br><span style="font-size: 1.1rem; color: #1877f2; font-weight: bold;">⏱ Таймер: ${timeString}</span>`;
        
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdownTimer);
          // Время вышло — автоматически включаем камеру обратно!
          startCamera();
        }
      }, 1000);
    }
  </script>
</body>
</html>
